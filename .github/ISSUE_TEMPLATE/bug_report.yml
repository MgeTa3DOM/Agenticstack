name: Bug Report
description: Report a bug in Apophy Sovereign
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Apophy Sovereign!
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      value: |
        1. Run `apophy-sovereign ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - apophy-sovereign (main binary)
        - Agent Fleet (Divine Synarchy)
        - Infrastructure (Skool/Gitea/Cloudflare)
        - MCP Integration
        - Cryptography
        - API Endpoints
        - CLI Commands
        - Docker / Deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Rust version:
        - Hardware (GPU/CPU):
