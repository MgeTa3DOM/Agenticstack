name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: apophy-sovereign
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: apophy-sovereign
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: apophy-sovereign

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p apophy-sovereign

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../apophy-sovereign-${{ matrix.target }}.tar.gz ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apophy-sovereign-${{ matrix.target }}
          path: apophy-sovereign-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apophy-sovereign-*/apophy-sovereign-*.tar.gz
